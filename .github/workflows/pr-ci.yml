name: PR CI (Impacted)

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3072m -Dkotlin.daemon.jvm.options=-Xmx1536m
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for diff base...head

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine affected tests
        id: affected
        run: |
          chmod +x .github/scripts/affected-tests.sh
          RESULT="$(.github/scripts/affected-tests.sh)"
          {
            echo "result<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Affected result: $RESULT"

      - name: Run Lint (only when code changes)
        if: steps.affected.outputs.result != 'NONE'
        timeout-minutes: 10
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Run impacted unit tests
        if: steps.affected.outputs.result != 'NONE' && steps.affected.outputs.result != 'FULL'
        timeout-minutes: 15
        run: |
          ARGS=()
          for cls in ${{ steps.affected.outputs.result }}; do
            ARGS+=(--tests "$cls")
          done
          echo "Running: ./gradlew --no-daemon --stacktrace --info :app:testDebugUnitTest ${ARGS[*]}"
          ./gradlew --no-daemon --stacktrace --info :app:testDebugUnitTest "${ARGS[@]}"

      - name: Run full unit tests (fallback)
        if: steps.affected.outputs.result == 'FULL'
        timeout-minutes: 20
        run: ./gradlew --no-daemon --stacktrace --info testDebugUnitTest

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 14

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 14
